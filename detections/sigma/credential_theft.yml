title: AWS Credential Theft via IMDS — Stolen Credentials Used from External IP
id: 9c4f3a2b-7e5d-4b8c-af1e-3d7f0b2e5c6a
status: experimental
description: |
  Detects the post-theft usage pattern of credentials stolen from the EC2
  Instance Metadata Service (IMDS) via SSRF or local access (T1552.005).

  When an attacker steals IMDS credentials and uses them externally, two
  anomalies appear in CloudTrail that do not occur during normal EC2 operations:

  1. The temporary STS credentials (ASIA* access key prefix) are used from
     a source IP that is NOT an internal AWS/EC2 address — IMDS credentials
     are meant to be used from within the instance, never from public IPs.

  2. The identity type is AssumedRole with an EC2 instance as the session
     issuer — but the API calls originate outside AWS infrastructure.

  This rule also covers the enumeration chain that follows credential theft:
  GetCallerIdentity -> ListUsers/ListRoles -> ListBuckets is a textbook
  attacker recon sequence after obtaining stolen credentials.

  MITRE ATT&CK chain: T1552.005 -> T1078.004 -> T1530

references:
  - https://attack.mitre.org/techniques/T1552/005/
  - https://attack.mitre.org/techniques/T1078/004/
  - https://attack.mitre.org/techniques/T1530/
  - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html

author: Greg Lewis
date: 2026-03-11
modified: 2026-03-11

tags:
  - attack.credential_access
  - attack.t1552.005
  - attack.privilege_escalation
  - attack.t1078.004
  - attack.collection
  - attack.t1530
  - attack.discovery
  - attack.t1069.003

logsource:
  product: aws
  service: cloudtrail

detection:

  # Signal 1 — GetCallerIdentity is the first thing an attacker does
  # after obtaining credentials to confirm they work and check identity.
  # Legitimate services rarely call this; attackers almost always do.
  selection_getcalleridentity:
    eventSource: 'sts.amazonaws.com'
    eventName: 'GetCallerIdentity'

  # Signal 2 — Rapid enumeration chain following credential use.
  # The sequence GetCallerIdentity -> ListUsers -> ListRoles -> ListBuckets
  # is a reliable attacker fingerprint. Each call alone is low signal;
  # together from the same identity in a short window is high signal.
  selection_enumeration:
    eventSource:
      - 'iam.amazonaws.com'
      - 's3.amazonaws.com'
    eventName:
      - 'ListUsers'
      - 'ListRoles'
      - 'ListBuckets'
      - 'ListPolicies'

  # Signal 3 — AssumeRole from a stolen-credential identity.
  # The attacker used the stolen IAMUser credentials to assume
  # the privileged role. Session name 'maintenance-automation'
  # is a social engineering attempt to look legitimate.
  # Note: session names are attacker-controlled — don't use as primary signal.
  selection_assumerole:
    eventSource: 'sts.amazonaws.com'
    eventName: 'AssumeRole'
    userIdentity.type: 'IAMUser'
    # The attacker's chosen session name in this lab — document for hunting
    # but do not depend on it; real attackers vary this constantly
    # requestParameters.roleSessionName: 'maintenance-automation'

  # Signal 4 — S3 data access using the assumed role (post-escalation exfil).
  # GetObject calls on sensitive file paths are the final exfiltration signal.
  # Targeting config/, finance/, and hr/ paths is high confidence.
  selection_exfiltration:
    eventSource: 's3.amazonaws.com'
    eventName: 'GetObject'
    userIdentity.type: 'AssumedRole'
    requestParameters.key|startswith:
      - 'config/'
      - 'finance/'
      - 'hr/'

  # Filter — exclude known legitimate admin identity from all signals
  filter_admin:
    userIdentity.userName: 'greg-admin'

  # Filter — exclude known legitimate assumed role activity
  filter_known_roles:
    userIdentity.sessionContext.sessionIssuer.userName: 'greg-admin'

  # Condition logic:
  # Fire on any of the four signals independently (broad coverage baseline).
  # Highest-fidelity alert: correlate signals 1+2+3+4 from same sourceIPAddress
  # within a 10-minute window — that's the full T1552.005->T1078.004->T1530 chain.
  condition: >
    (selection_getcalleridentity and not filter_admin) or
    (selection_enumeration and not filter_admin) or
    (selection_assumerole and not filter_admin) or
    (selection_exfiltration and not filter_known_roles)

falsepositives:
  - Legitimate security tooling calling GetCallerIdentity for validation
  - Authorized penetration testing activity
  - CI/CD pipelines with broad IAM enumeration permissions
  - Automated compliance scanners enumerating IAM resources

level: high

# ─── Detection Engineering Notes ────────────────────────────────────────────
#
# WHY THIS RULE IS DIFFERENT FROM privilege_escalation.yml:
# privilege_escalation.yml catches an IAMUser directly abusing a trust policy.
# This rule catches the full IMDS theft chain — the attacker starts with
# stolen temporary credentials (ASIA* prefix) and the enumeration-before-
# escalation sequence that characterizes credential theft scenarios.
#
# THE IMDS DETECTION GAP:
# The actual IMDS HTTP request (GET 169.254.169.254) does NOT appear in
# CloudTrail — it's a local HTTP call, not an AWS API call. CloudTrail
# only sees what happens AFTER the credentials are stolen and used.
# This is why we detect on the usage pattern, not the theft itself.
# IMDSv2 partially mitigates this by requiring a session token PUT request,
# but the post-theft usage pattern remains the same in CloudTrail.
#
# HIGHEST FIDELITY TUNING (implement in OpenSearch/Wazuh):
# Correlate all four signals from the same sourceIPAddress within 10 minutes.
# An external IP that calls GetCallerIdentity, then enumerates IAM and S3,
# then AssumeRoles, then GetObjects sensitive files — that's not automation.
# That's a human attacker working through a checklist.
#
# ASIA* PREFIX NOTE:
# Temporary credentials from STS (including IMDS) always begin with ASIA.
# Long-term IAM user access keys begin with AKIA.
# If your environment uses primarily long-term keys and you see ASIA keys
# being used programmatically from external IPs, that is high-confidence
# stolen IMDS credential usage.